<style>
  html, body { margin: 0; height: 100%; background: #EDFAF4; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100dvh; }
  #cj-guide { width: 100%; height: 100dvh; }
  .cj-home { position: absolute; left: 16px; top: 14px; display: none; color: #15803D; font: 600 .9rem "DM Sans", system-ui, sans-serif; text-decoration: none; }
  @media (min-width: 640px) {
    body { padding: 28px 16px; box-sizing: border-box; }
    #cj-guide { width: min(480px, 100%); height: min(820px, calc(100dvh - 56px)); border-radius: 22px; overflow: hidden; box-shadow: 0 24px 70px rgba(4, 36, 20, .16); border: 1px solid #D3F8DF; }

  }

<body>
<a class="cj-home" href="/">&larr; calmjoints.org</a>
<main id="cj-guide" aria-label="Calm Joints guide"></main>
<noscript><p style="padding:1rem;font-family:system-ui">Turn on JavaScript to chat, or <a href="https://calmjoints.org/?intent=book">book a video visit</a>. You’ll book through our partner clinic.</p></noscript>
<script src="/config.js"></script>
<script src="/js/guide.js?v=2"></script>
<script>
  (function () {
    var g = window.CJGuide.mountPage(document.getElementById('cj-guide'), { leadOpen: false });
    // QR visitors: warm up the guide so Chat opens instantly after the gate.
    if (window.CJGuide.ctx.src === 'qr') window.CJGuide.preload().catch(function () {});
  })();
</script>
