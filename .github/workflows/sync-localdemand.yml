# Rebuild the Calm Joints local-demand page from the live Scale page.
# Opens a pull request only when the generated HTML changes. Never merges.
# The 50% / Fall50 royalty pill is Align-only. The sync strips it whenever
# it is present upstream, and still opens a PR if that removal changes the page.
name: Sync local demand

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-localdemand
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate localdemand/index.html
        run: node scripts/sync-localdemand.mjs

      - name: Check the generated page
        run: node scripts/test-localdemand.mjs

      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright && npx playwright install --with-deps chromium

      - name: Smoke test real postal codes
        run: node scripts/test-localdemand-browser.mjs

      - name: Open a pull request if the page changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout -- package.json package-lock.json 2>/dev/null || true
          if git diff --quiet -- localdemand/index.html; then
            echo "Vendored page already matches upstream."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B sync/localdemand
          git add localdemand/index.html
          git commit -m "Sync Calm Joints local demand page from Scale"
          git push --force-with-lease -u origin sync/localdemand
          existing=$(gh pr list --head sync/localdemand --base main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr comment "$existing" --body "Updated the vendored page from https://scale-partner-dash.vercel.app/localdemand. This pull request is not merged automatically."
          else
            gh pr create --base main --head sync/localdemand --title "Sync local demand page" --body "The daily sync regenerated localdemand/index.html from https://scale-partner-dash.vercel.app/localdemand. The estimator is still proxied. The 50% / Fall50 royalty pill is Align-only: the sync strips that pill, its popover, the snapshot monetize checkbox, and any Fall50 link if they are present upstream. Review the diff before merging. This workflow does not merge."
          fi
