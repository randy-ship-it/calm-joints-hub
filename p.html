<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calm Joints | Book a physio visit</title>
<meta name="description" content="Video visits with a registered physiotherapist. Book in minutes.">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#15803D">
<link rel="icon" href="/media/calm-joints-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<style>
  :root{--green:#15803D;--ink:#0B1D16;--mute:#4B5E54;--line:#E6ECE8;--sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;color:var(--ink);font:17px/1.55 var(--sans);background:linear-gradient(180deg,#F1FBF4,#fff 60%);-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:1.2rem}
  .card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:2rem 1.6rem 1.6rem;box-shadow:0 30px 70px -35px rgba(10,61,34,.35)}
  .card img{height:36px;width:auto;margin-bottom:1.4rem}
  h1{font-size:1.6rem;line-height:1.15;letter-spacing:-.015em;margin:0}
  p{color:var(--mute);margin:.6rem 0 0}
  input{width:100%;margin-top:1.1rem;padding:.9rem 1rem;border:1px solid #CFD9D3;border-radius:12px;font:inherit}
  input:focus{outline:2px solid #86EFAC;border-color:var(--green)}
  .btn{display:flex;width:100%;align-items:center;justify-content:center;padding:1rem;border-radius:999px;font:700 1.05rem var(--sans);border:0;cursor:pointer;background:var(--green);color:#fff;margin-top:.9rem}
  .btn:hover{background:#116A32}.btn[disabled]{opacity:.7}
  .skip{display:block;width:100%;text-align:center;margin-top:.9rem;font:500 .9rem var(--sans);color:var(--mute);background:none;border:0;cursor:pointer;text-decoration:underline}
  .msg{min-height:1.2em;margin:.5rem 0 0;font-size:.9rem;font-weight:600;color:#B42318}
  .fine{font-size:.78rem;margin-top:1.2rem;text-align:center}
</style>
</head>
<body>
<form class="card" id="f" novalidate>
  <img src="/media/calm-joints-wordmark.svg" alt="Calm Joints" width="132" height="36">
  <h1>We’re connecting you to the clinic</h1>
  <p>Add your email so we can keep your visit on track. It’s optional.</p>
  <input type="email" id="email" autocomplete="email" placeholder="you@email.com" aria-label="Email (optional)">
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <button class="btn" id="go" type="submit">Continue to booking</button>
  <button class="skip" type="button" id="skip">Skip, take me to booking</button>
  <p class="fine">Video visits with registered physiotherapists.</p>
</form>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var slug = (qs.get('slug') || (location.pathname.split('/p/')[1] || '')).replace(/\/.*/, '').toLowerCase();
  var src = (qs.get('src') || 'qr').slice(0, 20);
  var bookUrl = (window.CALM_JOINTS && window.CALM_JOINTS.booking && window.CALM_JOINTS.booking.primaryUrl) || '/#book';
  var ok = /^[a-z0-9-]{3,48}$/.test(slug);
  function post(body) {
    try { return fetch('/api/qr-lead', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), keepalive: true }).catch(function () {}); }
    catch (e) { return Promise.resolve(); }
  }
  function remember(email) { try { localStorage.setItem('cj_ref', JSON.stringify({ slug: slug, email: email || null, at: Date.now() })); } catch (e) {} }
  function go(email) { remember(email); location.href = ok ? '/?ref=' + encodeURIComponent('partner:' + slug) + '#book' : bookUrl; }
  if (!ok) { go(); return; }
  try { var k = 'cj-visit-' + slug; if (!sessionStorage.getItem(k)) { sessionStorage.setItem(k, '1'); post({ slug: slug, event: 'visit', src: src }); } }
  catch (e) { post({ slug: slug, event: 'visit', src: src }); }
  document.getElementById('skip').addEventListener('click', function () { go(); });
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    if (!email) { go(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { document.getElementById('msg').textContent = 'That email doesn’t look quite right.'; return; }
    var b = document.getElementById('go'); b.disabled = true; b.textContent = 'Connecting…';
    Promise.race([post({ slug: slug, event: 'email', email: email, src: src }), new Promise(function (r) { setTimeout(r, 2000); })]).then(function () { go(email); });
  });
})();
</script>
</body>
</html>
