<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calm Joints</title>
<meta name="description" content="Tell us about you. Website, name, email, and we’ll be in touch.">
<meta name="theme-color" content="#15803D">
<link rel="canonical" href="https://calmjoints.org/">
<meta property="og:site_name" content="Calm Joints">
<meta property="og:title" content="Calm Joints">
<meta property="og:description" content="Tell us about you. Website, name, email, and we’ll be in touch.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://calmjoints.org/">
<meta property="og:image" content="https://calmjoints.org/media/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/media/calm-joints-mark.svg" type="image/svg+xml">
<link rel="icon" href="/media/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/media/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root { --green:#15803D; --green-2:#16A34A; --deep:#0A3D22; --mint:#DCF7E6; --ink:#0B1D16; --mute:#56675D; --line:#E3EAE6; --soft:#F4F8F5; --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:var(--ink); font:17px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
  img { display:block; max-width:100%; }
  a { color:inherit; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  .top { display:flex; align-items:center; justify-content:space-between; max-width:1120px; margin:0 auto; padding:1.2rem clamp(1.1rem,4vw,2rem); }
  .top img { height:38px; width:auto; }
  .top nav a { text-decoration:none; font-weight:600; font-size:.95rem; color:var(--mute); margin-left:1.4rem; }
  .top nav a:hover { color:var(--ink); }
  label { display:block; font-size:.86rem; font-weight:600; margin:0 0 .35rem; }
  input, textarea { width:100%; font:16px/1.4 var(--sans); color:var(--ink); background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:.85rem 1rem; outline:none; transition:border-color .15s, box-shadow .15s; }
  input:focus, textarea:focus { border-color:var(--green); box-shadow:0 0 0 4px rgba(21,128,61,.12); }
  textarea { min-height:112px; resize:vertical; }
  .field { margin-bottom:1rem; }
  .btn { display:inline-flex; align-items:center; justify-content:center; width:100%; padding:.95rem 1.4rem; border:0; border-radius:999px; background:var(--green); color:#fff; font:700 1rem var(--sans); cursor:pointer; transition:background .15s, transform .15s; }
  .btn:hover { background:#116A32; } .btn:active { transform:translateY(1px); } .btn[disabled] { opacity:.6; cursor:default; }
  .msg { min-height:1.4em; margin:.8rem 0 0; font-size:.92rem; font-weight:600; }
  .msg.ok { color:var(--green); } .msg.err { color:#B42318; }
  .hp { position:absolute; left:-5000px; }
  .foot { max-width:1120px; margin:0 auto; padding:2rem clamp(1.1rem,4vw,2rem) 2.4rem; display:flex; gap:1.2rem; flex-wrap:wrap; justify-content:space-between; color:var(--mute); font-size:.88rem; }
  .foot a { text-decoration:none; } .foot a:hover { color:var(--ink); }

  body { background:var(--soft); min-height:100vh; display:flex; flex-direction:column; }
  main { flex:1; display:grid; place-items:center; padding:1rem clamp(1.1rem,4vw,2rem) 2rem; }
  .card { width:100%; max-width:480px; background:#fff; border-radius:28px; padding:clamp(1.6rem,5vw,2.6rem); box-shadow:0 1px 0 var(--line), 0 30px 60px -30px rgba(10,61,34,.25); }
  .card .mark { width:56px; height:56px; margin-bottom:1.4rem; }
  h1 { margin:0; font-size:clamp(2rem,6vw,2.6rem); line-height:1.05; letter-spacing:-.03em; }
  .sub { margin:.6rem 0 1.8rem; color:var(--mute); }
  .opt { font-weight:400; color:var(--mute); }
  /* email pop */
  .pop { position:fixed; inset:auto 1rem 1rem auto; width:min(360px, calc(100vw - 2rem)); background:var(--deep); color:#fff; border-radius:22px; padding:1.4rem 1.4rem 1.2rem; box-shadow:0 30px 60px -20px rgba(0,0,0,.45); transform:translateY(24px); opacity:0; pointer-events:none; transition:opacity .35s, transform .35s; z-index:50; }
  .pop.on { transform:none; opacity:1; pointer-events:auto; }
  .pop h2 { margin:0 0 .3rem; font-size:1.3rem; letter-spacing:-.02em; }
  .pop p { margin:0 0 1rem; color:#BFE9CF; font-size:.95rem; }
  .pop .row { display:flex; gap:.5rem; }
  .pop input { border-color:transparent; padding:.75rem .9rem; }
  .pop .btn { width:auto; background:var(--green-2); padding:.75rem 1.1rem; }
  .pop .btn:hover { background:#1DB954; }
  .pop .x { position:absolute; top:.6rem; right:.7rem; background:none; border:0; color:#BFE9CF; font-size:1.4rem; line-height:1; cursor:pointer; padding:.3rem; }
  .pop .msg.ok { color:#9AF0BC; } .pop .msg.err { color:#FFB4A8; }
  @media (max-width:520px) { .pop { inset:auto .75rem .75rem .75rem; width:auto; padding:1.1rem 1.1rem .4rem; } .pop h2 { font-size:1.15rem; } .pop p { margin-bottom:.8rem; font-size:.9rem; } }
</style>
</head>
<body>
<header class="top"><a href="/" aria-label="Calm Joints home"><img src="/media/calm-joints-wordmark.svg" alt="Calm Joints" width="205" height="56"></a><nav><a href="/careers">Careers</a></nav></header>
<main>
  <form class="card" id="intake" novalidate>
    <img class="mark" src="/media/calm-joints-mark.svg" alt="" width="56" height="56">
    <h1>Let’s talk.</h1>
    <p class="sub">Leave your details and a person will get back to you.</p>
    <div class="field"><label for="website">Website</label><input id="website" name="website" type="text" inputmode="url" autocomplete="url" placeholder="yourbrand.com" required></div>
    <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" required></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="message">Anything else? <span class="opt">(optional)</span></label><textarea id="message" name="message" rows="4"></textarea></div>
    <input class="hp" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button class="btn" type="submit">Send</button>
    <p class="msg" role="status" aria-live="polite"></p>
  </form>
</main>
<footer class="foot">
  <span>© <span id="yr">2026</span> Calm Joints</span>
  <span><a href="/careers">Careers</a> &nbsp;·&nbsp; <a href="mailto:info@calmjoints.org">info@calmjoints.org</a></span>
</footer>
<aside class="pop" id="pop" role="dialog" aria-labelledby="pop-h" aria-hidden="true">
  <button class="x" type="button" aria-label="Close">×</button>
  <h2 id="pop-h">Stay in the loop</h2>
  <p>Clinic notes, now and then. No spam.</p>
  <form id="popform" novalidate>
    <div class="row"><label class="sr" for="pop-email">Email</label><input id="pop-email" name="email" type="email" autocomplete="email" placeholder="you@email.com" required><button class="btn" type="submit">Join</button></div>
    <input class="hp" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="msg" role="status" aria-live="polite"></p>
  </form>
</aside>
<script src="/form.js"></script>
<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  const KEY = 'cj-pop-done';
  const pop = document.getElementById('pop');
  const done = () => { try { localStorage.setItem(KEY, '1'); } catch (e) {} };
  const seen = () => { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } };
  const close = () => { pop.classList.remove('on'); pop.setAttribute('aria-hidden', 'true'); done(); };
  pop.querySelector('.x').addEventListener('click', close);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && pop.classList.contains('on')) close(); });
  cjForm(document.getElementById('intake'), '/api/intake', done);
  cjForm(document.getElementById('popform'), '/api/newsletter', () => { done(); setTimeout(close, 2200); });
  if (!seen()) setTimeout(() => { if (!seen()) { pop.classList.add('on'); pop.setAttribute('aria-hidden', 'false'); } }, 5000);
</script>
</body>
</html>
